# Genera las imágenes dinámicas del perfil (estadísticas 3D y serpiente de contribuciones)
# y las publica en la rama `output`, para no depender de servicios externos ni ensuciar `main`.
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *" # cada día a las 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Estadísticas 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=65a30d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=84cc16

      - name: Reunir archivos
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

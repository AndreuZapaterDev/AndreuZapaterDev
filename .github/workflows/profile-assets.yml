# Genera la tarjeta de actividad de GitHub (scripts/gen_activity.py) con datos reales
# y la publica en la rama `output`, para no depender de servicios externos ni ensuciar `main`.
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *" # cada día a las 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Tarjeta de actividad
        run: python3 scripts/gen_activity.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Genera las imágenes dinámicas del perfil (estadísticas 3D de contribuciones)
# y las publica en la rama `output`, para no depender de servicios externos ni ensuciar `main`.
name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *" # cada día a las 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Estadísticas 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Reunir archivos
        run: mkdir -p dist && cp profile-3d-contrib/*.svg dist/

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Andreu Zapater Fillat — Jefe del Departamento Digital · OK24Horas">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#84cc16" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow1" cx="1" cy="0" r=".7">
      <stop offset="0" stop-color="#84cc16" stop-opacity=".35"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="1" r=".6">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <!-- Destello que cruza "Fillat" cada 5 s -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-260;260;260" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-60;460;460" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="beamglow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#0a0f0a"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow1)">
      <animate attributeName="opacity" values=".75;1;.75" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="360" fill="url(#glow2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#84cc16" stroke-opacity=".25"/>
  <!-- Haz de luz que recorre el borde sin parar -->
  <g fill="none" stroke-linecap="round">
    <rect x="1" y="1" width="1198" height="358" rx="20" pathLength="1000" stroke="#84cc16" stroke-width="6" stroke-opacity=".7" stroke-dasharray="90 910" filter="url(#beamglow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="1198" height="358" rx="20" pathLength="1000" stroke="#d9f99d" stroke-width="2" stroke-dasharray="90 910">
      <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Columna izquierda -->
  <rect x="60" y="56" width="236" height="30" rx="15" fill="#84cc16" fill-opacity=".1" stroke="#84cc16" stroke-opacity=".5"/>
  <circle cx="80" cy="71" r="5" fill="#84cc16">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="94" y="76" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="2" fill="#84cc16">FULL STACK DEVELOPER</text>

  <text x="58" y="160" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Andreu Zapater</text>
  <text x="58" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#name)">Fillat</text>
  <text x="58" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#sheen)">Fillat</text>
  <text x="60" y="262" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a3a3a3">Jefe del Departamento Digital · OK24Horas</text>
  <rect x="60" y="290" width="71" height="30" rx="15" fill="#84cc16" fill-opacity=".1" stroke="#84cc16" stroke-opacity=".45"/><text x="96" y="310" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#d9f99d">React</text><rect x="141.0" y="290" width="88" height="30" rx="15" fill="#84cc16" fill-opacity=".1" stroke="#84cc16" stroke-opacity=".45"/><text x="185" y="310" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#d9f99d">Laravel</text><rect x="239.2" y="290" width="114" height="30" rx="15" fill="#84cc16" fill-opacity=".1" stroke="#84cc16" stroke-opacity=".45"/><text x="296" y="310" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#d9f99d">TypeScript</text>

  <!-- Terminal -->
  <rect x="672" y="56" width="476" height="264" rx="12" fill="#0f150f" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".1"/>
  <path d="M684 56h452a12 12 0 0 1 12 12v24H672V68a12 12 0 0 1 12-12z" fill="#182018"/>
  <circle cx="692" cy="74" r="6" fill="#ff5f57"/>
  <circle cx="712" cy="74" r="6" fill="#febc2e"/>
  <circle cx="732" cy="74" r="6" fill="#28c840"/>
  <text x="910" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#737373">andreu@ok24horas: ~</text>
  <clipPath id="c0"><rect x="700" y="110" width="0" height="26"><animate attributeName="width" values="0;0;76;76" keyTimes="0;0.0491;0.0901;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="128" clip-path="url(#c0)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#84cc16">$</tspan> <tspan fill="#f5f5f5">whoami</tspan></text><clipPath id="c1"><rect x="700" y="140" width="0" height="26"><animate attributeName="width" values="0;0;281;281" keyTimes="0;0.1188;0.1196;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="158" clip-path="url(#c1)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#a3a3a3">Andreu - Full Stack Developer</tspan></text><clipPath id="c2"><rect x="700" y="170" width="0" height="26"><animate attributeName="width" values="0;0;139;139" keyTimes="0;0.1400;0.2039;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="188" clip-path="url(#c2)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#84cc16">$</tspan> <tspan fill="#f5f5f5">cat stack.txt</tspan></text><clipPath id="c3"><rect x="700" y="200" width="0" height="26"><animate attributeName="width" values="0;0;353;353" keyTimes="0;0.2326;0.2334;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="218" clip-path="url(#c3)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#a3a3a3">React · Laravel · TypeScript · Docker</tspan></text><clipPath id="c4"><rect x="700" y="230" width="0" height="26"><animate attributeName="width" values="0;0;247;247" keyTimes="0;0.2539;0.3767;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="248" clip-path="url(#c4)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#84cc16">$</tspan> <tspan fill="#f5f5f5">git checkout -b migracion</tspan></text><clipPath id="c5"><rect x="700" y="260" width="0" height="26"><animate attributeName="width" values="0;0;245;245" keyTimes="0;0.4054;0.4062;1" dur="12.21s" repeatCount="indefinite"/></rect></clipPath><text x="700" y="278" clip-path="url(#c5)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15"><tspan fill="#84cc16">ASP.NET → React + Laravel</tspan></text>
  <g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.4267" calcMode="discrete" dur="12.21s" repeatCount="indefinite"/><rect x="912" y="264" width="9" height="18" fill="#84cc16"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
</svg>
